# Stack cloud ISNO (open-core, auto-hebergeable).
#   cp .env.example .env   puis   docker compose up -d --build
# puis ouvrir https://<votre-domaine>/setup dans les 5 minutes. Tout le reste se fait dans /setup :
# nom du broker (son certificat est cree avec), base de donnees (SQLite embarque, MongoDB installe a
# la demande, ou MongoDB externe). Le broker et MongoDB sont installes par le superviseur.
services:
  # Seul composant qui voit le socket Docker. Filtre : n'ouvre que images, conteneurs, volumes, reseaux,
  # creation et demarrage ; exec, build, system, swarm... restent fermes. Joignable par le seul superviseur.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    container_name: isno-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - VOLUMES=1
      - NETWORKS=1
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - EXEC=0
      - BUILD=0
      - SYSTEM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dockerapi]

  # Superviseur : installe les modules du catalogue a la demande de l'app (facon Supervisor de Home
  # Assistant). Non expose ; secret partage genere au premier demarrage dans le volume de controle.
  supervisor:
    build: ./supervisor
    container_name: isno-supervisor
    restart: unless-stopped
    environment:
      - STACK_NETWORK=isno-cloud-net
      - DOCKER_HOST=http://socket-proxy:2375
      - BROKER_PUBLIC_PORT=${BROKER_PUBLIC_PORT:-8883}
      - MONGO_CACHE_GB=${MONGO_CACHE_GB:-0.25}
    volumes:
      - control:/control
    networks: [stack, dockerapi]
    depends_on: [socket-proxy]

  server:
    build: .                                # image unique : coeur backend + app Astro SSR (web/)
    container_name: isno-cloud-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"              # derriere votre reverse-proxy ; pas d'exposition publique directe
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_PATH=/data/isno-cloud.db        # fichier SQLite si SQLite est choisi a l'installation
      - PKI_DIR=/data/pki                   # CA et relais : prive au serveur (la cle de la CA ne sort pas d'ici)
      - BROKER_CERTS_DIR=/broker-certs      # certificat du broker, partage avec lui
      - BROKER_CONFIG_DIR=/broker-config    # mosquitto.conf + acl, partages avec lui
      - BROKER_PUBLIC_PORT=${BROKER_PUBLIC_PORT:-8883}
      - SUPERVISOR_URL=http://supervisor:8090
      - SUPERVISOR_TOKEN_FILE=/control/token
    volumes:
      - server-data:/data
      - control:/control:ro
      - broker-certs:/broker-certs
      - broker-config:/broker-config
    networks: [stack]
    depends_on: [supervisor]

networks:
  stack:
    name: isno-cloud-net                   # nom fixe : les modules installes s'y rattachent
  dockerapi:
    internal: true                         # pas de sortie, et l'app n'y est pas : seul le superviseur parle au filtre

volumes:
  server-data:
  control:
  # Ecrits par le serveur, montes en lecture seule par le broker (installe par le superviseur) :
  # noms fixes, ceux du catalogue du superviseur.
  broker-certs:
    name: isno-broker-certs
  broker-config:
    name: isno-broker-config
