# Stack cloud ISNO (open-core, auto-hébergeable). Par défaut : broker MQTT mTLS + serveur, avec
# SQLite embarqué (aucune base à gérer). Pour passer sur MongoDB, ajouter le greffon :
#   docker compose -f docker-compose.yml -f docker-compose.mongo.yml up -d --build
# Avant : ./scripts/gen-ca.sh <votre-domaine>  puis  cp .env.example .env
services:
  broker:
    image: eclipse-mosquitto:2.0.22
    container_name: isno-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./config:/mosquitto/config
      - ./certs:/mosquitto/certs
      - broker-data:/mosquitto/data
  server:
    build: .                                # image unique : coeur backend + app Astro SSR (web/)
    container_name: isno-cloud-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - CERTS_DIR=/certs
      - BROKER_URL=mqtts://broker:8883
      - DB_PATH=/data/isno-cloud.db        # store SQLite par défaut (ignoré si MONGO_URL défini)
    volumes:
      - ./certs:/certs
      - server-data:/data
    depends_on:
      - broker
volumes:
  broker-data:
  server-data:
